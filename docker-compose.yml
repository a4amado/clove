services:

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_started
      clove:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - main_network

  clove:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: clove
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - main_network
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - ENV=PROD
      - POSTGRES_DATABASE_URL=postgresql://postgres:example@db:5432/clove?sslmode=disable
      - VALKEY_STORE_URL=redis://:mypassword@valkey:6379/0
      - VALKEY_FANOUT_URL=redis://:mypassword@valkey:6379/1
      - VALKEY_HEARTBEAT_URL=redis://:mypassword@valkey:6379/3
      - REGION=dk1
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_READER_BUFFER_SIZE=1000
      - RABBITMQ_PREFETCH_COUNT=100
      - RABBITMQ_NUM_READERS=5
      - MAILJET_API_KEY=3eb4240fd3a39737a465193758b8a60f
      - MAILJET_API_SECRETS=0735fbb5b4be3c84d00775b88e13e56b
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: frontend
    depends_on:
      clove:
        condition: service_healthy
    networks:
      - main_network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    networks:
      - main_network
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  valkey:
    image: valkey/valkey:latest
    container_name: valkey
    networks:
      - main_network
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: valkey-server --requirepass mypassword --appendonly yes
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "mypassword", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:17
    container_name: postgres
    networks:
      - main_network
    ports:
      - "5432:5432"
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: clove
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/internals/data/postgres/schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  valkey_data:
    driver: local
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  main_network:
    driver: bridge