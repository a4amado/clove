info:
  name: Get Current User
  type: http
  seq: 1
  tags:
    - Auth

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/me"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: localhost

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/auth/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "created_at": {},
            "hash": "",
            "id": {},
            "number_of_emails": 0,
            "role": {
              "user_role": "",
              "valid": false
            },
            "updated_at": {}
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/auth/me"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": 0,
            "context": {},
            "error": "",
            "status": ""
          }
