info:
  name: User Signup
  type: http
  seq: 3
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/sign-up"
  body:
    type: json
    data: |-
      {
        "confirm_password": "",
        "email": "",
        "password": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/auth/sign-up"
      method: POST
      body:
        type: json
        data: |-
          {
            "confirm_password": "",
            "email": "",
            "password": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "created_at": {},
            "hash": "",
            "id": {},
            "number_of_emails": 0,
            "role": {
              "user_role": "",
              "valid": false
            },
            "updated_at": {}
          }
  - name: 409 Response
    description: Conflict
    request:
      url: "{{baseUrl}}/api/v1/auth/sign-up"
      method: POST
      body:
        type: json
        data: |-
          {
            "confirm_password": "",
            "email": "",
            "password": ""
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": 0,
            "context": {},
            "error": "",
            "status": ""
          }
  - name: 500 Response
    description: Internal Server Error
    request:
      url: "{{baseUrl}}/api/v1/auth/sign-up"
      method: POST
      body:
        type: json
        data: |-
          {
            "confirm_password": "",
            "email": "",
            "password": ""
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": 0,
            "context": {},
            "error": "",
            "status": ""
          }
