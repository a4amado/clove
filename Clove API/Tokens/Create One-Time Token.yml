info:
  name: Create One-Time Token
  type: http
  seq: 1
  tags:
    - Tokens

http:
  method: POST
  url: "{{baseUrl}}/api/v1/apps/:app_id/tokens"
  params:
    - name: app_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "channel_id": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

