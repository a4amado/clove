info:
  name: Create App
  type: http
  seq: 1
  tags:
    - Apps

http:
  method: POST
  url: "{{baseUrl}}/api/v1/apps"
  body:
    type: json
    data: |-
      {
        "allowed_origins": "",
        "app_slug": "",
        "plan": "free",
        "regions": "",
        "user_id": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

