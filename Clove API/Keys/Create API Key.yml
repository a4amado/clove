info:
  name: Create API Key
  type: http
  seq: 2
  tags:
    - Keys

http:
  method: POST
  url: "{{baseUrl}}/api/v1/apps/:app_id/keys"
  params:
    - name: app_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

